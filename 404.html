<style>
/* Layout: straightforward single column, full-width photo hero, services alternating photo and text, navy band for the family, plain contact block. Blue throughout, from navy to pale ice. */
:root{
  --ice:#EEF3F8;
  --white:#FFFFFF;
  --sky:#C9DCEE;
  --blue:#2C6AAE;
  --navy:#17365C;
  --deep:#0E2340;
  --text:#1B2B3F;
  --muted:#5A6B80;
  --line:#D3DEEA;
  --head:'Libre Franklin','Helvetica Neue',Arial,sans-serif;
  --body:'Source Sans 3','Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ice:#0E1A28;--white:#15243A;--sky:#243B5A;--blue:#7FB2E8;--navy:#1B3253;--deep:#0A1626;
    --text:#E6EEF7;--muted:#9FB2C8;--line:#243B5A;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ice:#0E1A28;--white:#15243A;--sky:#243B5A;--blue:#7FB2E8;--navy:#1B3253;--deep:#0A1626;
  --text:#E6EEF7;--muted:#9FB2C8;--line:#243B5A;color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ice);color:var(--text);font-family:var(--body);font-size:18px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--white)}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:clamp(28px,3.6vw,40px);font-weight:600;color:var(--navy)}
h3{font-size:24px;font-weight:600;color:var(--navy)}
p{margin:0}
a{color:var(--blue)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.measure{max-width:36em}
.muted{color:var(--muted)}
.btn{display:inline-block;text-decoration:none;font-family:var(--head);font-weight:600;font-size:15px;padding:12px 22px;border-radius:4px;background:var(--blue);color:#fff;border:2px solid var(--blue)}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.onblue{background:#fff;color:var(--navy);border-color:#fff}
.btn.onblue.ghost{background:transparent;color:#fff}
.photo{background:var(--sky);border-radius:4px;display:grid;place-items:center;text-align:center;padding:0;color:var(--navy);font-size:13px;max-width:100%;overflow:hidden}
.photo .ill{width:100%;height:100%;display:block}
.photo{position:relative}
.photo .real{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hero .hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.hero .img.has-photo .tex{display:none}
.photo .ill use{}
.hero .tex{position:absolute;inset:0;width:100%;height:100%;opacity:.14}
.hero .img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,35,64,.92) 0%,rgba(14,35,64,.82) 38%,rgba(14,35,64,.35) 62%,rgba(14,35,64,0) 82%)}
@media (max-width:800px){.hero .img::after{background:rgba(14,35,64,.78)}}

/* top bar */
.util{background:var(--ice);border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.util .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:7px;white-space:nowrap}
.util .addr-line{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.util .addr-line svg{width:14px;height:14px;flex:none;color:var(--blue)}
.util .tel{display:inline-flex;align-items:center;gap:8px;font-family:var(--head);font-weight:600;font-size:14px;color:var(--navy);text-decoration:none;flex:none}
.util .tel svg{width:14px;height:14px;color:var(--blue)}
.util .tel:hover{color:var(--blue)}
.util-right{display:flex;align-items:center;gap:14px;flex:none}
.util .fb{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff}
.util .fb svg{width:15px;height:15px}
.util .fb:hover{background:var(--blue)}
footer .fb-link{display:inline-flex;align-items:center;gap:8px;color:#fff;text-decoration:none}
footer .fb-link svg{width:16px;height:16px}
footer .fb-link:hover{text-decoration:underline}
.top{background:var(--white);position:sticky;top:env(safe-area-inset-top,0px);z-index:9;box-shadow:0 1px 0 var(--line),0 6px 24px rgba(23,54,92,.06)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:32px;padding-block:12px;white-space:nowrap}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--navy);font-family:var(--head);font-weight:700;font-size:20px;line-height:1;flex:none;letter-spacing:-.01em}
.logo .mark{width:42px;height:42px;border-radius:9px;background:#17365C;display:grid;place-items:center;flex:none}
.logo .mark svg{width:40px;height:40px;border-radius:8px}
.logo small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.02em}
.top nav{flex:none}
.top nav ul{list-style:none;margin:0;padding:0;display:flex;gap:28px;align-items:center}
.top nav a{text-decoration:none;color:var(--text);font-size:15.5px;font-weight:500;padding:6px 0;position:relative;white-space:nowrap;transition:color .15s}
.top nav a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--blue);transform:scaleX(0);transform-origin:left;transition:transform .2s}
.top nav a:hover,.top nav a.active{color:var(--navy)}
.top nav a:hover::after,.top nav a.active::after{transform:scaleX(1)}
.top nav a.nav-offer{color:var(--blue);font-weight:600}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:42px;height:42px;cursor:pointer;color:var(--navy);place-items:center;flex:none}
.burger svg{width:22px;height:22px}
@media (max-width:1120px){
  .top nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--white);box-shadow:0 12px 30px rgba(23,54,92,.12);padding:12px max(16px,env(safe-area-inset-left,0px)) 18px}
  .top nav.open{display:block}
  .top nav ul{flex-direction:column;align-items:stretch;gap:2px}
  .top nav a{display:block;font-size:17px;padding:12px 14px;border-radius:8px}
  .top nav a::after{display:none}
  .top nav a:hover,.top nav a.active{background:var(--ice)}
  .burger{display:grid}
}
@media (max-width:600px){
  .util .addr-line span{display:none}
  .util .addr-line::after{content:"11 The Centre, Halstead"}
  .logo{font-size:17px}
}

/* hero */
.hero{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.hero .img{position:absolute;inset:0;background:linear-gradient(100deg,var(--deep) 0%,var(--navy) 45%,var(--blue) 120%)}
.hero .wrap{position:relative;padding-block:84px 72px}
.hero h1{font-size:clamp(36px,5.6vw,64px);font-weight:700;max-width:14em}
.hero p{font-size:20px;margin-top:20px;max-width:30em;color:rgba(255,255,255,.85)}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.hero .cta .btn{border-color:#fff}
@media (max-width:800px){.hero .wrap{padding-block:56px 48px}}

/* intro line */
.intro{background:var(--white);border-bottom:1px solid var(--line)}
.intro .wrap{display:flex;gap:16px 48px;flex-wrap:wrap;justify-content:space-between;align-items:center;padding-block:18px;font-size:16px}
.intro ul{list-style:none;margin:0;padding:0;display:flex;gap:10px 28px;flex-wrap:wrap}
.intro li{display:flex;align-items:center;gap:8px}
.intro li::before{content:"";width:10px;height:10px;background:var(--blue);border-radius:50%}

/* services */
.services .wrap{padding-block:64px 24px}
.services > .wrap > h2{margin-bottom:8px}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;padding-block:40px;border-top:1px solid var(--line)}
.svc:first-of-type{border-top:0;margin-top:24px}
.svc:nth-of-type(even) .photo{order:-1}
.svc .photo{aspect-ratio:4/3}
.svc p{margin-top:12px;color:var(--muted)}
.svc ul{margin:16px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.svc li{padding:9px 0;border-bottom:1px solid var(--line);font-size:17px}
.carousel-wrap{position:relative;margin-top:18px}
.carousel-wrap.full{grid-column:1/-1;margin-top:8px}
.carousel-wrap.full .strip{gap:14px}
.carousel-wrap.full figure{flex:0 0 150px}
.svc>div{min-width:0}
.carousel-wrap .strip{scroll-snap-type:none;overflow:hidden}
.carousel-wrap .track{display:flex;gap:14px;will-change:transform}
.carousel-wrap .strip{display:block}
.carousel-wrap.full .car-btn{top:75px}

.carousel-wrap .strip{margin-top:0;scroll-snap-type:x mandatory;scrollbar-width:none;padding-inline:2px}
.carousel-wrap .strip::-webkit-scrollbar{display:none}
.carousel-wrap figure{scroll-snap-align:start}
.car-btn{position:absolute;top:52px;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--white);color:var(--navy);font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 10px rgba(23,54,92,.12);z-index:1;padding:0 0 3px}
.car-btn.prev{left:-12px}.car-btn.next{right:-12px}
.car-btn:hover{background:var(--ice)}
.strip{display:flex;gap:10px;overflow-x:auto;margin-top:18px;padding-bottom:4px;scrollbar-width:thin}
.strip figure{flex:0 0 120px;margin:0}
.strip .photo{aspect-ratio:1;font-size:11px;padding:8px}
.strip figcaption{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.3}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ba figure{margin:0}
.ba .photo{aspect-ratio:3/4}
.ba figcaption{font-family:var(--head);font-weight:600;font-size:13px;color:var(--navy);margin-top:6px}
@media (max-width:800px){.svc{grid-template-columns:1fr;gap:22px;padding-block:32px}.svc:nth-of-type(even) .photo{order:0}}

/* about */
.about{background:var(--navy);color:#fff}
.about .wrap{padding-block:72px;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.about h2{color:#fff}
.about p{margin-top:16px;color:rgba(255,255,255,.82);max-width:34em}
.about .photo{background:rgba(255,255,255,.12);color:rgba(255,255,255,.75)}
.owners{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.owners figure{margin:0}
.owners .photo{aspect-ratio:4/5}
.owners figcaption{margin-top:10px;font-size:15px;color:rgba(255,255,255,.8)}
.owners figcaption b{display:block;font-family:var(--head);font-size:18px;color:#fff;margin-bottom:2px}
.shopfront{aspect-ratio:2/1;align-self:center}
@media (max-width:800px){.about .wrap{grid-template-columns:1fr;gap:32px;padding-block:52px}}

/* find us */
.find .wrap{padding-block:64px;display:grid;grid-template-columns:1fr 1fr;gap:48px}
.find h2{margin-bottom:16px}
.addr{font-style:normal;line-height:1.6;font-size:18px}
.addr b{font-family:var(--head);font-weight:600;color:var(--navy)}
.find .cta{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 28px}
.today{display:inline-flex;align-items:center;gap:8px;font-family:var(--head);font-weight:600;font-size:15px;color:var(--navy);margin-bottom:14px;min-height:22px}
.today::before{content:"";width:9px;height:9px;border-radius:50%;background:#3BA55D;flex:none}
.today.shut::before{background:#C4553A}
.today:empty{display:none}
.hours{display:grid;grid-template-columns:auto 1fr;gap:0 28px;margin:0;max-width:24em;border-top:1px solid var(--line)}
.hours dt,.hours dd{padding:7px 0;border-bottom:1px solid var(--line);margin:0}
.hours dt{color:var(--muted)}
.hours dd{font-variant-numeric:tabular-nums}
.hours dd.closed{color:var(--muted)}
.hours .is-today{color:var(--navy);font-weight:600}
.hours dt.is-today{position:relative;padding-left:14px}
.hours dt.is-today::before{content:"";position:absolute;left:0;top:50%;width:6px;height:6px;border-radius:50%;background:var(--blue);transform:translateY(-50%)}
.collect+.collect{margin-top:10px}
.collect b{font-weight:600;color:var(--navy)}
.collect{margin-top:24px;padding:16px 18px;background:var(--white);border-left:4px solid var(--blue);font-size:17px}
.map{aspect-ratio:4/3}
.agents{margin-top:22px}
.agents h3{font-size:20px;margin-bottom:6px}
.agents table{width:100%;border-collapse:collapse;font-size:16px;margin-top:8px}
.agents td{padding:9px 0;border-top:1px solid var(--line);vertical-align:top}
.agents td:last-child{color:var(--muted);text-align:right}
@media (max-width:800px){.find .wrap{grid-template-columns:1fr;gap:32px;padding-block:48px}}


/* promo bar */
.promo{background:var(--blue);color:#fff}
.promo .wrap{display:flex;gap:10px 20px;flex-wrap:wrap;align-items:center;justify-content:center;padding-block:10px;font-size:15px;text-align:center}
.promo b{font-family:var(--head);font-weight:600}
.promo a{color:#fff;font-weight:600;white-space:nowrap}

/* offers */
.offers{background:var(--white);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.offers .wrap{padding-block:64px}
.offers h2{margin-bottom:8px}
.offer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:32px}
.offer{border:1px solid var(--line);border-radius:4px;background:var(--ice);padding:26px 26px 22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.offer.lead{background:var(--navy);color:#fff;border-color:var(--navy);grid-column:span 3;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.offer .tag{font-family:var(--head);font-size:13px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}
.offer.lead .tag{color:var(--sky)}
.offer h3{font-size:22px}
.offer.lead h3{color:#fff;font-size:clamp(26px,3.4vw,36px)}
.offer .price{font-family:var(--head);font-size:34px;font-weight:700;color:var(--navy);line-height:1}
.offer .price small{font-size:15px;font-weight:400;color:var(--muted);margin-left:6px}
.offer.lead .price{color:#fff;font-size:clamp(40px,6vw,64px);text-align:right}
.offer.lead .price small{color:var(--sky);display:block;text-align:right;margin:6px 0 0}
.offer p{font-size:16px;color:var(--muted)}
.offer.lead p{color:rgba(255,255,255,.82);max-width:34em}
.offer .fine{font-size:13px;color:var(--muted);margin-top:auto;padding-top:8px}
.offer.lead .fine{color:rgba(255,255,255,.6)}
.offers .how{margin-top:28px;display:flex;gap:12px 32px;flex-wrap:wrap;align-items:center;font-size:16px;color:var(--muted)}
@media (max-width:800px){.offer-grid{grid-template-columns:1fr}.offer.lead{grid-column:span 1;grid-template-columns:1fr}.offer.lead .price,.offer.lead .price small{text-align:left}}

/* cookie notice */
.cookie{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;max-width:560px;margin:0 auto;background:var(--white);color:var(--text);border:1px solid var(--line);border-radius:6px;box-shadow:0 12px 40px rgba(23,54,92,.18);padding:16px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:15px}
.cookie p{flex:1 1 260px;margin:0;line-height:1.45}
.cookie .btns{display:flex;gap:8px}
.cookie .btn{padding:9px 16px;font-size:14px}
.cookie[hidden]{display:none}

.privacy{border-top:1px solid var(--line)}
.privacy .wrap{padding-block:18px}
.privacy summary{cursor:pointer;font-size:14px;color:var(--muted);font-weight:500}
.privacy summary:hover{color:var(--navy)}
.privacy-body{max-width:40em;font-size:14.5px;color:var(--muted);padding-top:10px;display:grid;gap:10px}
.privacy-body b{color:var(--text);font-weight:600}
footer a{color:#fff}

footer{background:var(--deep);color:rgba(255,255,255,.7);font-size:14px}
footer .wrap{padding-block:26px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:#fff}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
